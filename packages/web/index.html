<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoBento</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>InfoBento</h1>
      <span class="badge">EDITOR <span id="app-version"></span></span>
      <div class="header-actions">
        <div class="menu-wrapper" id="header-menu">
          <button
            class="btn-secondary menu-trigger"
            id="btn-menu"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Menu &#9662;
          </button>
          <div class="menu-dropdown" role="menu">
            <button class="menu-item" id="btn-import" role="menuitem" type="button">
              &uarr; Import JSON
            </button>
            <button class="menu-item" id="btn-export" role="menuitem" type="button">
              &darr; Export JSON
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- Preview -->
      <section class="preview-cell">
        <div id="eink-display" class="eink-display"></div>
        <div class="preview-controls">
          <span class="preview-meta">eInk</span>
          <div class="preview-stepper" id="font-size-control">
            <span>Font</span>
            <button class="stepper-btn" id="font-size-dec" type="button">-</button>
            <span class="stepper-value" id="font-size-display">38px</span>
            <button class="stepper-btn" id="font-size-inc" type="button">+</button>
          </div>
          <label class="preview-control" id="font-weight-control">
            Font Weight
            <input type="range" id="font-weight-slider" min="1" max="9" step="1" />
            <span class="stepper-value" id="font-weight-display">6</span>
          </label>
          <div class="preview-stepper" id="corner-radius-control">
            <span>Corners</span>
            <button class="stepper-btn" id="corner-radius-dec" type="button">-</button>
            <span class="stepper-value" id="corner-radius-display">3</span>
            <button class="stepper-btn" id="corner-radius-inc" type="button">+</button>
          </div>
          <div class="preview-stepper" id="padding-control">
            <span>Padding</span>
            <button class="stepper-btn" id="padding-dec" type="button">-</button>
            <span class="stepper-value" id="padding-display">4</span>
            <button class="stepper-btn" id="padding-inc" type="button">+</button>
          </div>
          <label class="preview-toggle" id="device-profile-control">
            Display
            <select id="device-profile-select"></select>
          </label>
          <label class="preview-toggle" id="toggle-headers">
            <input type="checkbox" />
            Show Box Headers
          </label>
          <label class="preview-toggle" id="toggle-landscape">
            <input type="checkbox" />
            Landscape
          </label>
        </div>
      </section>

      <!-- Editor -->
      <section class="editor-cell">
        <div id="box-list"></div>
        <div class="config-toolbar config-toolbar-bottom add-chips-toolbar">
          <div class="add-chips" id="add-chips"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
