<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InfoBento</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>InfoBento</h1>
      <span class="badge">EDITOR <span id="app-version"></span></span>
      <div class="header-actions">
        <div class="menu-wrapper" id="header-menu">
          <button
            class="btn-secondary menu-trigger"
            id="btn-menu"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Menu &#9662;
          </button>
          <div class="menu-dropdown" role="menu">
            <button class="menu-item" id="btn-import" role="menuitem" type="button">
              &uarr; Import JSON
            </button>
            <button class="menu-item" id="btn-export" role="menuitem" type="button">
              &darr; Export JSON
            </button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <!-- Preview -->
      <section class="preview-cell">
        <div id="eink-display" class="eink-display"></div>
        <div class="preview-controls">
          <span class="preview-meta">2-bit grayscale &middot; landscape + portrait</span>
          <label class="preview-toggle" id="toggle-headers">
            <input type="checkbox" />
            Show Box Headers
          </label>
          <label class="preview-control" id="font-size-control">
            <span>Font Size</span>
            <input type="range" id="font-size-slider" min="8" max="42" step="1" value="38" />
            <span id="font-size-display">38px</span>
          </label>
          <label class="preview-control" id="corner-radius-control">
            <span>Corners</span>
            <input type="range" id="corner-radius-slider" min="0" max="10" step="1" value="3" />
            <span id="corner-radius-display">3</span>
          </label>
          <label class="preview-control" id="padding-control">
            <span>Padding</span>
            <input type="range" id="padding-slider" min="0" max="10" step="1" value="4" />
            <span id="padding-display">4</span>
          </label>
        </div>
      </section>

      <!-- Editor -->
      <section class="editor-cell">
        <div class="config-toolbar">
          <h2>Boxes</h2>
          <div class="add-box-wrapper">
            <select id="add-type-select">
              <option value="forecast3d">8-Day Forecast</option>
              <option value="forecast">8hr Forecast</option>
              <option value="aqi">Air Quality</option>
              <option value="countdown">Countdown</option>
              <option value="date">Date</option>
              <option value="moon">Moon Phase</option>
              <option value="progress">Progress</option>
              <option value="qr">QR Code</option>
              <option value="quote">Quote</option>
              <option value="sun">Sunrise/Sunset</option>
              <option value="text">Text</option>
              <option value="weather">Weather</option>
            </select>
            <button class="btn-primary" id="btn-add">+ Add Box</button>
          </div>
        </div>
        <div id="box-list"></div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
