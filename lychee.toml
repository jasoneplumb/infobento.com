# Lychee link checker configuration
# Used by CI docs-check job to validate documentation links

max_concurrency = 10
timeout = 20
max_retries = 3
retry_wait_time = 2
accept = [200, 206, 301, 302, 307, 308, 429]

exclude = [
  # Localhost and development URLs
  'http://localhost',
  'https://localhost',
  'http://127\.0\.0\.1',
  'https://127\.0\.0\.1',

  # Example/placeholder URLs
  'http://example\.com',
  'https://example\.com',

  # Mailto links
  'mailto:',

  # GitHub issue relative links
  '/issues/\d+'
]

verbose = "info"
