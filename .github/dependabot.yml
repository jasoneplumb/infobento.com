version: 2
updates:
  # npm workspaces (root manifest covers packages/*)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # Major npm bumps tend to need code migration (e.g. opentype.js 2.x,
    # TypeScript 6, vitest 4); handle those manually. Auto-PR minor/patch only.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: 'development'
      prod-dependencies:
        dependency-type: 'production'
  # GitHub Actions used by the workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
