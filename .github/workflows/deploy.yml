name: Deploy to Production

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only one deployment at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Full quality gate against the exact release commit (#247). Tag pushes do
  # not trigger ci.yml, so there is no CI run for this SHA to depend on —
  # the gate has to run here. Mirrors ci.yml step-for-step; keep them in sync.
  # timeout-minutes bounds a hung run so it can't hold the deploy-production
  # concurrency slot for GitHub's 6-hour default (review finding on #249).
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # The package is built and uploaded here — by the same job whose build
      # the tests just exercised — and the deploy job ships that exact
      # artifact instead of rebuilding. An independent rebuild would not be
      # bit-for-bit identical (the setup-guide PDF embeds a creation
      # timestamp), so "ship what you tested" requires handing the artifact
      # over rather than trusting a second build (review finding on #249).
      - name: Create deployment package
        run: |
          # Package everything needed for production:
          # - Built JS in packages/*/dist/
          # - Vite web bundle in packages/web/dist/
          # - package.json files for npm ci --production
          # - Source not needed at runtime (TypeScript compiled to JS)
          tar -czf infobento-deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='clones' \
            --exclude='logs' \
            --exclude='*.test.ts' \
            --exclude='*.test.js' \
            --exclude='tsconfig*.json' \
            --exclude='vitest.config.ts' \
            --exclude='.eslintrc*' \
            --exclude='.prettierrc*' \
            --exclude='prototypes' \
            --exclude='hardware' \
            --exclude='docs' \
            --exclude='.tux' \
            package.json \
            package-lock.json \
            packages/ \
            deploy/

      - name: Upload deployment package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infobento-deploy
          path: infobento-deploy.tar.gz
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: quality-gate
    runs-on: ubuntu-latest
    environment: production
    # Generous bound: a real deploy takes a few minutes, and hung SSH
    # connections already self-terminate (ServerAliveInterval). This keeps
    # the concurrency slot bounded without risking a mid-deploy kill.
    timeout-minutes: 30
    steps:
      # Checkout only for scripts/ and the package.json version read below —
      # the shipped code comes exclusively from the tested artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download deployment package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: infobento-deploy

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy
        env:
          # Auth env vars (issue #73): the deploy script forwards these into
          # the systemd unit so they're available at runtime. They are NOT
          # baked into the build artifact.
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RP_ID: ${{ secrets.RP_ID }}
          RP_ORIGIN: ${{ secrets.RP_ORIGIN }}
          OAUTH_REDIRECT_BASE: ${{ secrets.OAUTH_REDIRECT_BASE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=60 -o ServerAliveInterval=30"
          SSH_TARGET="${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          VERSION=$(node -p "require('./package.json').version")

          source "$GITHUB_WORKSPACE/scripts/ssh-retry.sh"

          ssh_retry "scp $SSH_OPTS scripts/deploy-infobento.sh $SSH_TARGET:/tmp/deploy-infobento.sh"
          ssh_retry "cat infobento-deploy.tar.gz | ssh $SSH_OPTS $SSH_TARGET 'DEPLOY_SHA=${{ github.sha }} DEPLOY_VERSION=$VERSION SESSION_SECRET=\"$SESSION_SECRET\" RP_ID=\"$RP_ID\" RP_ORIGIN=\"$RP_ORIGIN\" OAUTH_REDIRECT_BASE=\"$OAUTH_REDIRECT_BASE\" GOOGLE_CLIENT_ID=\"$GOOGLE_CLIENT_ID\" GOOGLE_CLIENT_SECRET=\"$GOOGLE_CLIENT_SECRET\" APPLE_CLIENT_ID=\"$APPLE_CLIENT_ID\" APPLE_TEAM_ID=\"$APPLE_TEAM_ID\" APPLE_KEY_ID=\"$APPLE_KEY_ID\" APPLE_PRIVATE_KEY=\"$APPLE_PRIVATE_KEY\" bash /tmp/deploy-infobento.sh'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Smoke test
        run: |
          echo "Waiting 10s for server to start..."
          sleep 10
          MAX_RETRIES=6
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -sf --max-time 15 -o /dev/null -w '%{http_code}' "https://www.infobento.com/api/health" 2>/dev/null || echo '0')
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Smoke test passed (HTTP $HTTP_CODE)"
              break
            fi
            if [ "$i" = "$MAX_RETRIES" ]; then
              echo "::error::Smoke test failed after $MAX_RETRIES attempts (last HTTP code: $HTTP_CODE)"
              exit 1
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done
