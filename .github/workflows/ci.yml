name: CI

on:
  push:
    branches:
      - mainline
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The root build now includes the web bundle, so a Node-only import
      # reaching `web` fails here instead of at tag time in deploy.yml —
      # which is how #231 shipped. Folding it into the root script rather
      # than adding a CI-only step means any future workflow gets the same
      # coverage without having to remember it.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
