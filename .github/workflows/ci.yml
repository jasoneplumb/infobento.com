name: CI

on:
  push:
    branches:
      - mainline
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The root build is `tsc -b` only, so it never exercises the browser
      # bundle. Without this step a Node-only import reaching `web` compiles,
      # typechecks and tests clean, then fails in deploy.yml at tag time —
      # which is exactly how #231 shipped. Build the bundle here so it fails
      # the PR instead.
      - name: Build web bundle
        run: npm run build -w @infobento/web

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
