name: Claude Code Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: >-
      github.event.label.name == 'review-requested'
      && contains(github.event.pull_request.labels.*.name, 'review-requested')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review this pull request for:
            - Logic errors and edge cases
            - Type safety and TypeScript correctness
            - Adherence to DESIGN.md specifications and CLAUDE.md guidelines
            - Security vulnerabilities
            - Performance concerns

            Focus on substantive issues. Skip formatting, naming bikeshedding, and anything handled by linters.
            Post your findings as inline comments on specific lines and a summary comment on the PR.
          claude_args: '--model claude-sonnet-4-6 --max-turns 100 --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"'
